name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Type check and frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5 # Match Dockerfile
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build

  container:
    name: Compose build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Disposable values for the isolated test container, not production secrets.
      YI_PASSWORD: ci-test-yi
      JQ_PASSWORD: ci-test-jq
      SESSION_SECRET: ci-only-session-secret
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker compose --progress plain build --pull app
      - run: docker compose up --no-build --wait --wait-timeout 120 app
      - name: Verify health API and built frontend
        run: |
          docker compose exec -T app wget -qO- http://127.0.0.1:3000/api/health | jq -e '.ok == true'
          docker compose exec -T app wget -qO- http://127.0.0.1:3000/ | grep -F '/assets/'
      - if: failure()
        run: docker compose logs --no-color app
      - if: always()
        run: docker compose down --volumes --remove-orphans
